substitutions:
  _REGION: europe-west1
  # Set _STORAGE_BACKEND=firestore (and raise _MAX_INSTANCES) for durable multi-instance Cloud Run storage.
  # Default sqlite mode uses ephemeral container storage (/app/data/secrets.db) with max 1 instance.
  _STORAGE_BACKEND: firestore
  _MAX_INSTANCES: '10'
  _FIRESTORE_COLLECTION: burnbin_secrets
  _FIRESTORE_DATABASE: '(default)'
  _SERVICE_ACCOUNT: burnbin-run@$PROJECT_ID.iam.gserviceaccount.com

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/burnbin/burnbin:$COMMIT_SHA'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/burnbin/burnbin:$COMMIT_SHA'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'burnbin'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/burnbin/burnbin:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--memory'
      - '512Mi'
      - '--set-env-vars'
      - 'DB_PATH=/app/data/secrets.db,STORAGE_BACKEND=${_STORAGE_BACKEND},FIRESTORE_COLLECTION=${_FIRESTORE_COLLECTION},FIRESTORE_DATABASE=${_FIRESTORE_DATABASE}'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'
      - '--allow-unauthenticated'
      - '--quiet'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/burnbin/burnbin:$COMMIT_SHA'
