steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/burnbin:$COMMIT_SHA', '.']

  # Push the container image to Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/burnbin:$COMMIT_SHA']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'burnbin'
      - '--image'
      - 'gcr.io/$PROJECT_ID/burnbin:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--max-instances'
      - '1'
      - '--memory'
      - '512Mi'
      - '--set-env-vars'
      - 'DB_PATH=/app/data/secrets.db'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/burnbin:$COMMIT_SHA'
