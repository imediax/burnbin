name: Release Signed Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.BURNBIN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/burnbin-release.jks
          fi

      - name: Build Signed Release APK
        working-directory: android
        env:
          BURNBIN_KEYSTORE_PATH: burnbin-release.jks
          BURNBIN_KEYSTORE_PASSWORD: ${{ secrets.BURNBIN_KEYSTORE_PASSWORD }}
          BURNBIN_KEY_ALIAS: ${{ secrets.BURNBIN_KEY_ALIAS }}
          BURNBIN_KEY_PASSWORD: ${{ secrets.BURNBIN_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Prepare BurnBin.apk artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk BurnBin.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BurnBin.apk
          generate_release_notes: true
