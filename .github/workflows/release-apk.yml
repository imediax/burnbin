name: Release Signed Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Run Python and Web JS verification tests
        run: |
          python3 test_app.py -v
          node test_web.js

      - name: Rebuild Signed Release APK if release keystore secret is configured
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.BURNBIN_KEYSTORE_BASE64 }}
          BURNBIN_KEYSTORE_PASSWORD: ${{ secrets.BURNBIN_KEYSTORE_PASSWORD }}
          BURNBIN_KEY_ALIAS: ${{ secrets.BURNBIN_KEY_ALIAS }}
          BURNBIN_KEY_PASSWORD: ${{ secrets.BURNBIN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > burnbin-release.jks
            chmod +x gradlew
            BURNBIN_KEYSTORE_PATH=burnbin-release.jks ./gradlew testDebugUnitTest assembleRelease --console=plain
            cp app/build/outputs/apk/release/app-release.apk ../BurnBin.apk
          else
            echo "Using repository pre-signed BurnBin.apk release binary."
          fi

      - name: Verify BurnBin.apk release binary exists
        run: |
          test -s BurnBin.apk
          ls -lh BurnBin.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BurnBin ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: BurnBin.apk
          generate_release_notes: false
