name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Python backend tests
        run: python3 test_app.py -v
      - name: Run Web JS crypto, bundle, shared & QR tests
        run: node test_web.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests, instrumentation compile check & lint
        working-directory: android
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintVitalRelease --console=plain
